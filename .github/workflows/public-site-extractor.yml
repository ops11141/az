name: Public Site Extractor

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL to analyze (http/https only)"
        required: true
        type: string
      search_value:
        description: "Optional public search value to submit to the site's search form"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract public data
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SEARCH_VALUE: ${{ inputs.search_value }}
        run: node tools/site-extractor.mjs

      - name: Show extraction summary
        run: |
          node -e "const r=require('./output/extraction.json'); console.log(JSON.stringify({target:r.target,pages:r.pages.length,network:r.network.length,forms:r.pages.reduce((n,p)=>n+(p.forms||[]).length,0),tables:r.pages.reduce((n,p)=>n+(p.tables||[]).length,0)},null,2))"

      - name: Upload extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-site-extraction
          path: output/
          retention-days: 7
