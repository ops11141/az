name: Public Site Extractor

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL to analyze (http/https only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract public data
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node tools/site-extractor.mjs

      - name: Upload extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-site-extraction
          path: output/
          retention-days: 7
