<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواقع المعدات</title><style>
:root{--g:#008f6b;--g2:#006b52;--bg:#f3f7f5;--text:#17302a;--muted:#6c7b76;--line:#dfe9e5;--shadow:0 8px 30px #00322314}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}a{text-decoration:none;color:inherit}
header{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:0 3px 15px #0002}.head{max-width:1450px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:190px;height:66px;background:#fff;border-radius:11px;padding:4px}.logo img{width:100%;height:100%;object-fit:contain}.head h1{margin:0;font-size:21px}.head p{margin:4px 0 0;opacity:.9}
nav{max-width:1450px;margin:10px auto 0;display:flex;gap:7px;flex-wrap:wrap}nav a{background:#ffffff1c;border:1px solid #ffffff33;color:#fff;padding:8px 11px;border-radius:9px;font-size:13px}nav a:hover{background:#fff;color:var(--g2)}
main{max-width:1450px;margin:auto;padding:20px 12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.tools{padding:14px;display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{flex:1;min-width:180px;padding:13px;border:1px solid #cfded8;border-radius:10px;font-size:15px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--g);color:#fff;font-weight:bold;cursor:pointer}.btn.alt{background:#edf5f2;color:var(--g2)}.btn.dark{background:#073b4c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.stat{padding:14px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat b{font-size:21px}.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 14px}.chip{border:1px solid #cfe1da;background:#f5faf8;color:var(--g2);padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:bold}.table{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th{background:#edf5f2;color:var(--g2);padding:12px;text-align:right}td{padding:10px;border-bottom:1px solid #edf1ef}tr:hover{background:#f8fcfa}.coord{font-family:Consolas,monospace;direction:ltr}.maplink{background:var(--g);color:#fff;padding:7px 9px;border-radius:8px;font-size:12px;display:inline-block}.pagination{text-align:center;padding:15px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.page{border:1px solid #cfe0da;background:#fff;color:var(--g2);border-radius:8px;padding:8px 12px;cursor:pointer}.page.active{background:var(--g);color:#fff}.empty{text-align:center;padding:45px;color:var(--muted)}.badge{display:inline-block;background:#eaf6f1;color:var(--g2);padding:4px 8px;border-radius:7px;font-weight:bold;font-size:12px}.small{font-size:12px;color:var(--muted)}
.hero{padding:28px 20px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#eaf7f2)}.hero h2{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.homecard{padding:22px;transition:.2s}.homecard:hover{transform:translateY(-3px)}.homeicon{font-size:38px}.homecard h3{margin:10px 0 6px}.homecard p{color:var(--muted);line-height:1.7}.homecard .btn{display:inline-block;margin-top:8px}
.modal{position:fixed;inset:0;background:#001b1680;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.modal.show{display:flex}.modalbox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#edf2f0;color:#17302a;border-radius:9px;padding:8px 12px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.detail{border:1px solid var(--line);padding:11px;border-radius:10px}.photo{border:2px dashed #cbded7;border-radius:14px;min-height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fbfa}.photo img{max-width:100%;max-height:320px;object-fit:contain}.photo input{display:none}.photo label{cursor:pointer;color:var(--g2);font-weight:bold;padding:30px;text-align:center}
#map{height:70vh;border-radius:15px;overflow:hidden}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.logo{width:145px;height:58px}.head h1{font-size:17px}.detailgrid{grid-template-columns:1fr}}@media(max-width:480px){main{padding:12px 8px}.tools input,.tools select{min-width:100%}.stat{padding:10px}.stat b{font-size:17px}}
</style></head><body><header><div class="head"><div class="logo"><img src="logo.png"></div><div><h1>مواقع المعدات</h1><p>قسم الصيانة - السعودية للطاقة</p></div></div><nav><a href="index.html">⌂ الرئيسية</a><a href="equipment.html">⚡ مواقع المعدات</a><a href="meters.html">🔢 مواقع العدادات</a><a href="map.html">🗺️ الخريطة التفاعلية</a></nav></header><main><div class="card"><div class="tools"><input id="q" placeholder="ابحث برقم المعدة أو النوع أو الإحداثية... مثال: 650-007 أو RMU"><select id="type"><option value="">كل الأنواع</option></select><button class="btn alt" onclick="clearAll()">مسح</button><button class="btn dark" onclick="openMap()">🗺️ الخريطة</button></div><div class="chips" id="chips"></div></div>
<div class="stats"><div class="card stat"><small>إجمالي المعدات</small><b id="total">...</b></div><div class="card stat"><small>نتائج البحث</small><b id="count">...</b></div><div class="card stat"><small>الصفحة</small><b id="pi">1</b></div><div class="card stat"><small>النتائج/صفحة</small><b>50</b></div></div>
<div class="card table"><table><thead><tr><th>#</th><th>المعدة</th><th>النوع</th><th>الإحداثيات</th><th>الموقع</th><th>التفاصيل</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" style="display:none">لا توجد نتائج.</div><div class="pagination" id="pages"></div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="close" onclick="closeModal()">إغلاق</button></div><div class="detailgrid" id="details"></div><div class="photo" id="photo"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a id="mm" class="btn" target="_blank">📍 Google Maps</a><button class="btn alt" id="cp">📋 نسخ الإحداثيات</button></div></div></div></main><script>
let D=[],F=[],pg=1,S=50,current;const $=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=x=>String(x??'').toLowerCase().replace(/[\s\-_\/]+/g,'').replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
const typ=x=>((String(x).match(/^[A-Za-z]+/)||['TF'])[0]).toUpperCase();
async function load(){D=await fetch('data/equipment.json').then(r=>r.json());D=D.map((r,i)=>({...r,i,type:typ(r.tf)}));let ts=[...new Set(D.map(r=>r.type))].sort();type.innerHTML='<option value="">كل الأنواع</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join('');chips.innerHTML=ts.map(t=>`<button class="chip" onclick="choose('${t}')">${esc(t)}</button>`).join('');apply()}
function choose(t){type.value=t;apply()}function clearAll(){q.value='';type.value='';apply()}function openMap(){location.href='map.html?q='+encodeURIComponent(q.value)+'&type='+encodeURIComponent(type.value)}
function apply(){let s=norm(q.value),t=type.value;F=D.filter(r=>(!s||norm(r.tf+' '+r.type+' '+r.coord+' '+r.x+' '+r.y).includes(s))&&(!t||r.type===t)).map(r=>r.i);pg=1;render()}
function render(){let tp=Math.max(1,Math.ceil(F.length/S));pg=Math.max(1,Math.min(pg,tp));let rs=F.slice((pg-1)*S,pg*S).map(i=>D[i]);total.textContent=D.length.toLocaleString('ar-SA');count.textContent=F.length.toLocaleString('ar-SA');pi.textContent=pg+' / '+tp;empty.style.display=rs.length?'none':'block';body.innerHTML=rs.map((r,j)=>{let c=r.y!=null&&r.x!=null?`${r.y}, ${r.x}`:r.coord;let m=r.y!=null&&r.x!=null?`https://www.google.com/maps?q=${r.y},${r.x}`:'';return `<tr><td>${(pg-1)*S+j+1}</td><td><b>${esc(r.tf)}</b></td><td><span class="badge">${esc(r.type)}</span></td><td class="coord">${esc(c)}</td><td>${m?`<a class="maplink" target="_blank" href="${m}">📍 فتح</a>`:'-'}</td><td><button class="btn alt" onclick="show(${r.i})">عرض</button></td></tr>`}).join('');let a='';for(let p=Math.max(1,pg-3);p<=Math.min(tp,pg+3);p++)a+=`<button class="page ${p===pg?'active':''}" onclick="pg=${p};render()">${p}</button>`;pages.innerHTML=`<button class="page" onclick="pg--;render()">السابق</button>${a}<button class="page" onclick="pg++;render()">التالي</button>`}
function show(i){current=D.find(r=>r.i===i);mt.textContent='المعدة '+current.tf;details.innerHTML=`<div class="detail"><small>رقم المعدة</small><br><b>${esc(current.tf)}</b></div><div class="detail"><small>النوع</small><br><b>${esc(current.type)}</b></div><div class="detail"><small>X خط الطول</small><br><b>${esc(current.x)}</b></div><div class="detail"><small>Y خط العرض</small><br><b>${esc(current.y)}</b></div><div class="detail" style="grid-column:1/-1"><small>الإحداثية</small><br><b class="coord">${esc(current.y)}, ${esc(current.x)}</b></div>`;let key='eqPhoto_'+norm(current.tf),saved=localStorage.getItem(key);photo.innerHTML=saved?`<img src="${saved}"><label for="ph">📷 تغيير الصورة</label><input id="ph" type="file" accept="image/*">`:`<label for="ph">📷 إضافة صورة للمعدة<br><span class="small">تحفظ محلياً في هذا الجهاز</span></label><input id="ph" type="file" accept="image/*">`;ph.onchange=e=>savePhoto(e);mm.href=current.y!=null&&current.x!=null?`https://www.google.com/maps?q=${current.y},${current.x}`:'#';cp.onclick=()=>navigator.clipboard?.writeText(`${current.y}, ${current.x}`);modal.classList.add('show')}
function savePhoto(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{localStorage.setItem('eqPhoto_'+norm(current.tf),r.result);show(current.i)}catch(_){alert('الصورة كبيرة، اختر صورة أصغر')}};r.readAsDataURL(f)}
function closeModal(){modal.classList.remove('show')}q.oninput=apply;type.onchange=apply;load();
</script></body></html>
