<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827">
<title>نموذج تصعيد الأعطال</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--line:#2b3b52;--text:#eef4fb;--muted:#9fb0c5;--gold:#e4b85c;--green:#44d3a2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#1a2c43 0,transparent 35%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text);padding:24px 14px 40px}.wrap{max-width:900px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;padding:20px 22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#18263a,#101827);box-shadow:0 18px 45px #0003}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#e4b85c18;border:1px solid #e4b85c66;color:var(--gold);font-size:27px}h1{font-size:clamp(20px,4vw,28px);margin:0 0 6px}.subtitle{margin:0;color:var(--muted);font-size:13px}.clock{direction:ltr;text-align:left;white-space:nowrap}.date{font-size:12px;color:var(--muted);margin-bottom:5px}.time{font-size:21px;font-weight:bold;letter-spacing:.6px;font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,#142033,#101827);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #0002}.card-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-head h2{margin:0;font-size:17px}.live{direction:ltr;display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}form{padding:22px}.section-title{font-size:13px;color:var(--gold);margin:0 0 14px;font-weight:bold}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px;min-width:0}.field.full{grid-column:1/-1}label{font-size:13px;color:#c9d6e6}input{width:100%;background:#0c1523;border:1px solid #304159;border-radius:12px;padding:13px 14px;color:var(--text);font:inherit;font-size:14px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e4b85c18}input::placeholder{color:#62758c}input[type=datetime-local]{direction:ltr;text-align:left;color-scheme:dark}.divider{height:1px;background:var(--line);margin:24px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:linear-gradient(135deg,#f0cd7d,#d9a943);color:#1a2432;flex:1}.secondary{background:#213149;color:var(--text);border:1px solid #3a4e68}.danger{background:#3a2029;color:#ffb1b3;border:1px solid #71363e}.preview{margin-top:22px;display:none}.preview.show{display:block}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.preview-head h2{font-size:17px;margin:0}.report-output{white-space:pre-wrap;line-height:1.9;background:#0c1523;border:1px solid var(--line);border-radius:16px;padding:20px;font-size:14px;overflow-wrap:anywhere}.foot{text-align:center;color:#72859d;font-size:11px;margin-top:18px}
@media(max-width:600px){body{padding:12px 10px 28px}header{padding:16px;align-items:flex-start}.logo{width:45px;height:45px}.time{font-size:17px}.date{font-size:10px}.fields{grid-template-columns:1fr}form{padding:16px}.card-head{padding:16px}.actions button{width:100%}}
</style></head><body><div class="wrap">
<header><div class="brand"><div class="logo">⚡</div><div><h1>نموذج تصعيد الأعطال</h1><p class="subtitle">Fault Escalation Report · نموذج إدخال وتجهيز التقرير</p></div></div><div class="clock"><div class="date" id="todayDate">Loading date...</div><div class="time" id="currentTime">--:--:--</div></div></header>
<main class="card"><div class="card-head"><h2>🛑 بيانات تقرير التصعيد</h2><div class="live"><span class="dot"></span> LIVE CLOCK</div></div>
<form id="reportForm"><p class="section-title">◈ بيانات البلاغ</p><div class="fields">
<div class="field"><label for="area">المنطقة</label><input id="area" placeholder="اسم المنطقة"></div>
<div class="field"><label for="transformer">رقم المحول</label><input id="transformer" placeholder="رقم المحول"></div>
<div class="field"><label for="task">رقم المهمة</label><input id="task" placeholder="رقم المهمة"></div>
<div class="field"><label for="diagnosis">تشخيص العطل</label><input id="diagnosis" placeholder="تشخيص العطل"></div>
<div class="field"><label for="department">القسم</label><input id="department" placeholder="اسم القسم"></div>
<div class="field"><label for="contractor">المقاول</label><input id="contractor" placeholder="اسم المقاول"></div>
<div class="field"><label for="customers">عدد المشتركين</label><input id="customers" type="number" min="0" inputmode="numeric" placeholder="0"></div>
<div class="field"><label for="complaints">عدد البلاغات</label><input id="complaints" type="number" min="0" inputmode="numeric" placeholder="0"></div></div>
<div class="divider"></div><p class="section-title">◈ أوقات العمل والتسليم</p><div class="fields">
<div class="field"><label for="startWork">بداية العمل</label><input id="startWork" type="datetime-local"></div>
<div class="field"><label for="endWork">نهاية العمل</label><input id="endWork" type="datetime-local"></div>
<div class="field"><label for="reportTime">وقت تسجيل البلاغ</label><input id="reportTime" type="datetime-local"></div>
<div class="field"><label for="controlTime">وقت تسليم العطل للتحكم</label><input id="controlTime" type="datetime-local"></div>
<div class="field"><label for="maintenanceTime">وقت تسليم العطل للصيانة</label><input id="maintenanceTime" type="datetime-local"></div>
<div class="field"><label for="overrun">مدة التجاوز (بالساعات)</label><input id="overrun" type="number" min="0" step="0.25" inputmode="decimal" placeholder="مثال: 2.5"></div></div>
<div class="actions"><button type="button" class="primary" id="generateBtn">إنشاء نص التقرير</button><button type="button" class="secondary" id="copyBtn">نسخ التقرير</button><button type="reset" class="danger">مسح الحقول</button></div></form></main>
<section class="preview" id="preview"><div class="preview-head"><h2>معاينة التقرير</h2><button type="button" class="secondary" id="copyPreviewBtn">نسخ النص</button></div><div class="report-output" id="reportOutput" dir="rtl"></div></section>
<div class="foot">التاريخ والوقت بالإنجليزية · English date &amp; time</div></div>
<script>
const $=id=>document.getElementById(id);
function updateClock(){const n=new Date();$('todayDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',year:'numeric',month:'short',day:'2-digit'}).format(n);$('currentTime').textContent=new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(n)}
updateClock();setInterval(updateClock,1000);
function fmt(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)}
function val(id){return $(id).value.trim()}
function makeReport(){const over=val('overrun');return ['🛑 تصعيد 🛑','','🔹المنطقة : '+val('area'),'🔹رقم المحول: '+val('transformer'),'🔹رقم المهمة : '+val('task'),'🔹تشخيص العطل : '+val('diagnosis'),'🔹  القسم : '+val('department'),'🔹 المقاول : '+val('contractor'),'🔹عدد المشتركين : '+val('customers'),'🔹بداية العمل : '+fmt(val('startWork')),'🔹نهاية العمل: '+fmt(val('endWork')),'🔹عدد البلاغات: '+val('complaints'),'🔹وقت تسجيل البلاغ: '+fmt(val('reportTime')),'🔹وقت تسليم العطل للتحكم : '+fmt(val('controlTime')),'🔹وقت تسليم العطل للصيانه: '+fmt(val('maintenanceTime')),'','♦️ (( تجاوز '+(over?over+' ساعة':'كذا ساعة')+' ))'].join('\n')}
function generate(){ $('reportOutput').textContent=makeReport();$('preview').classList.add('show');$('preview').scrollIntoView({behavior:'smooth',block:'start'})}
async function copyReport(){const t=makeReport();$('reportOutput').textContent=t;$('preview').classList.add('show');try{await navigator.clipboard.writeText(t);$('copyBtn').textContent='تم النسخ ✓';$('copyPreviewBtn').textContent='تم النسخ ✓';setTimeout(()=>{$('copyBtn').textContent='نسخ التقرير';$('copyPreviewBtn').textContent='نسخ النص'},1800)}catch(e){const r=document.createRange();r.selectNodeContents($('reportOutput'));const s=window.getSelection();s.removeAllRanges();s.addRange(r);$('copyBtn').textContent='حدد النص ثم انسخه'}}
$('generateBtn').addEventListener('click',generate);$('copyBtn').addEventListener('click',copyReport);$('copyPreviewBtn').addEventListener('click',copyReport);$('reportForm').addEventListener('reset',()=>setTimeout(()=>{$('preview').classList.remove('show');$('reportOutput').textContent=''},0));
</script></body></html>
